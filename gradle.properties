# # # # # # # # # # # # # #
#    Project Properties   #
# # # # # # # # # # # # # #

# Gradle Settings
org.gradle.jvmargs=-Xmx24G
org.gradle.parallel=true

# Mossy Plugin (https://github.com/LopyMine/MossyPlugin)
mossy_plugin_version = 4.10.0

# Data Properties
data.mod_id = skintrim
data.mod_name = Skintrim
data.mod_version = 1.0.0
data.mod_group = net.darkz70.skintrim
data.mod_maven_group = net.darkz70
data.mixin_configs = none
data.sides = both

data.mod_description = Change your skin and cape right in game! From a file, a URL or a username - locally, via Mojang, or synced to everyone on the server.
data.mod_authors = darkz70
data.github_mod_author = darkz70
data.mod_license = CC-BY-ND 4.0

# Base Properties
base.lombok_version = 1.18.42
base.mixinextras_version = 0.4.1
base.mixin_version = 0.8.5

# Per-Loader Versions
fabric.multi_versions = 26.2 26.3
neoforge.multi_versions = 1.21.1 1.21.11 26.1.2
forge.multi_versions = 1.20.1

# Mod Loaders
mod_loaders = fabric

# Build Properties
build.fabric_loader = 0.19.3
build.fabric_api = [VERSIONED]
build.neoforge = [VERSIONED]
build.parchment = [VERSIONED]
build.forge = [VERSIONED]

# Additional Dependencies, "dep." is important
dep.modmenu = [VERSIONED]

# # # # # # # # # # # # # #
#  Publication Properties #
# # # # # # # # # # # # # #

# Supported Versions, 1.21[1] -> 1.21-1.21.1
fabric.versions_specifications = 26.2 26.3
neoforge.versions_specifications = 1.21.11
forge.versions_specifications = 1.21.11

# Version Type [RELEASE, BETA, ALPHA]
version_type = RELEASE

# Imitation of Publishing. Set to "true" for testing
test_publish = false

# Project IDs (TODO: replace with the real Skintrim project ids before publishing)
modrinth_id = unknown
curseforge_id = unknown

# CurseForge Settings
is_for_client = true
is_for_server = true
max_java_version = 25

# Fabric Dependencies
fabric.depends_requires = fabric-api
fabric.depends_optional = modmenu yacl
fabric.depends_incompatible = none
fabric.depends_embeds  = none

# NeoForge Dependencies
neoforge.depends_requires = none
neoforge.depends_optional = none
neoforge.depends_incompatible = none
neoforge.depends_embeds  = none

# Forge Dependencies
forge.depends_requires = none
forge.depends_optional = none
forge.depends_incompatible = none
forge.depends_embeds  = none

# Stonecutter Stuff
dev.kikugie.stonecutter.hard_mode=true
