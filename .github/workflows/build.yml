name: Build
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix:
        platform: [fabric]
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - run: chmod +x ./gradlew
      - name: Build ${{ matrix.platform }}
        run: |
          set +e
          ./gradlew buildAndCollect+${{ matrix.platform }}+All -Pci_loader=${{ matrix.platform }} > build-output.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "===== BUILD FAILED (exit $code), last log lines: ====="
            tail -n 120 build-output.log | sed 's/%/%25/g; s/\r/%0D/g' | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-${{ matrix.platform }}
          path: libs/
